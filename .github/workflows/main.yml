name: create a rg in azure
on:
  push:
    branches:
      - main
permissions: 
  id-token: write
  contents: read

jobs:
  terraform:
    name: terraform deployent
    runs-on: DESKTOP-0FD8243

  steps:
    - name: azure login
      uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}    

 
 
      
